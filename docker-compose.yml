services:
  # ==========================================
  # Redis 快取與 Celery Broker（Message Queue）
  # ==========================================
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # FastAPI 後端 API 伺服器
  # 注意：此基底檔不寫 build: 也不寫 image:
  # 由 dev/prod 各自補上，避免 EC2 誤觸 build
  # ==========================================
  backend:
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Celery 背景工作者（Worker）
  # 與 backend 共用同一個 image，只有 command 不同
  # ==========================================
  worker:
    command: celery -A worker.tasks worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ==========================================
  # Next.js 前端
  # ==========================================
  frontend:
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ==========================================
  # Nginx 反向代理（Reverse Proxy）
  # 統一對外入口，將流量分發給 frontend 與 backend
  # ==========================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
