services:
  # ==========================================
  # FastAPI 後端（本地開發 override）
  # build: 只在這裡定義，EC2 不會誤觸
  # volumes: 掛載本機程式碼實現 hot reload
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # build 完後打上 dev tag，讓 worker 可以共用同一個 image
    image: easy-travel-backend:dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    # depends_on 在多個 compose 檔之間是「覆蓋」而非「合併」，
    # 所以這裡必須把 redis（基底檔原有）和 mysql（dev 專屬）都列出，
    # 否則會覆蓋掉基底檔對 redis 的依賴。
    # backend import 時因 mincached 會立刻連 DB，故必須等 mysql healthy 才啟動。
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  # ==========================================
  # Celery Worker（本地開發 override）
  # 共用 backend build 出來的 image（不重複 build）
  # Celery 沒有 auto reload，改完 code 要手動 restart
  # ==========================================
  worker:
    image: easy-travel-backend:dev
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.dev
    # worker 共用 backend 的 image，import 時同樣會連 DB，
    # 故也要等 redis 與 mysql 都 healthy 才啟動。
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy

  # ==========================================
  # Next.js 前端（本地開發 override）
  # NEXT_PUBLIC_* 變數必須在 build 時期傳入（build args），
  # 因為 Next.js 會在 npm run build 時把值燒進 JS bundle，
  # 不是 runtime 才讀取，所以光靠 env_file 是不夠的。
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local

  # ==========================================
  # Redis（本地開發開放 port，方便直接用工具連進去 debug）
  # ==========================================
  redis:
    ports:
      - "6379:6379"

  # ==========================================
  # MySQL 8.0（本地開發專用，取代 Mac 本機安裝的 MySQL）
  # init.sql 會在 container 第一次啟動時自動執行，建立所有資料表
  # ==========================================
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: localdev
      MYSQL_DATABASE: easy-travel-scheduler
    # healthcheck：讓 Docker 能判斷 MySQL 是否「真的可以接受連線」，
    # 而不只是「container 啟動了」。backend/worker 會等這個 healthy 才啟動，
    # 避免在 MySQL 初始化（灌 schema）期間就去連線而被 Connection refused。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-plocaldev"]
      interval: 5s      # 每 5 秒檢查一次
      timeout: 5s       # 單次檢查逾時
      retries: 10       # 連續失敗 10 次才判定 unhealthy（給足初始化時間）
      start_period: 30s # 啟動後前 30 秒的失敗不計入 retries（MySQL 8.0 首次初始化較久）
    ports:
      # 左邊是 Mac(host)端 port，右邊是 container 內部 port。
      # Mac 本機已有 MySQL 佔用 3306，故對外改用 3307 避免衝突。
      # 注意：這只影響「Mac 用工具連進來 debug/倒資料」要用的 port，
      #       backend/worker 連 DB 走的是內部網路 mysql:3306，完全不受影響。
      - "3307:3306"
    volumes:
      # 資料持久化：container 刪掉重建資料也不會消失
      - mysql_data:/var/lib/mysql
      # 第一次啟動時自動執行 schema，建立所有資料表
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - app-network

volumes:
  mysql_data:
