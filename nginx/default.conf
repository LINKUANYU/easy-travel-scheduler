server {
    listen 80;
    server_name _;

    # ==========================================
    # 【新增】SSE 專用路由
    # 必須擺在 /api/ 大塊「之前」，Nginx 會優先匹配更精確的路徑
    # ==========================================
    location /api/search/stream/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 不可缺少的設定
        proxy_buffering off;      # 關閉緩衝，讓後端 yield 的每一個訊息立即流到前端
        proxy_cache off;          # 關閉快取，SSE 是即時串流不應被快取
        proxy_read_timeout 600s;  # 允許連線最多保持 10 分鐘（對應後端 MAX_RETRIES 200 * 3s）
    }

    # 1. 將請求代理到 Next.js 前端 (對應 docker-compose 裡的 frontend 服務)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. 將 /api/ 開頭的請求代理到 FastAPI 後端 (對應 docker-compose 裡的 backend 服務)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI 需要讀取這個檔案才能畫出畫面
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
